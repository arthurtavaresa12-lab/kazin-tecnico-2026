name: Kazin Tecnico - Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto V28
        run: |
          unzip -o Kazin_Tecnico_2026_V28_Nuvem.zip
          ls -la
          ls -la app

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Criar arquivos Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KazinTecnico2026"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Gerar APK
        run: gradle assembleDebug --no-daemon

      - name: Gerar AAB
        run: gradle bundleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-AAB
          path: app/build/outputs/bundle/release/app-release.aab
